plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fitcoach.shapemaster'
    compileSdk 34

    defaultConfig {
        applicationId "com.fitcoach.shapemaster"
        minSdk 24
        targetSdk 34
        versionCode 45
        versionName "2.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", '"' + (project.findProperty('qingsuApiBase') ?: 'https://124.220.54.64') + '"'
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Distribution signing and rotation proof are applied by scripts/sign-release.py.
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testBuildType "release"
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
}
