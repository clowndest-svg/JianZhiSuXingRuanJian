<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>轻塑 · 页面没打开</title>
<style>
  :root{--primary:#10B981;--primary-dark:#047857;--bg:#F8FAFC;--card:#FFFFFF;
        --text-main:#0F172A;--text-muted:#475569;--text-light:#94A3B8;--border:#E2E8F0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       padding:24px;background:var(--bg);color:var(--text-main);
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  .card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);
        border-radius:20px;padding:28px 22px;text-align:center;
        box-shadow:0 10px 25px rgba(0,0,0,.06)}
  .badge{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;
         display:flex;align-items:center;justify-content:center;
         background:#ECFDF5;border:1px solid #A7F3D0}
  .badge svg{width:30px;height:30px}
  h1{font-size:19px;margin:0 0 10px;letter-spacing:.2px}
  p{font-size:14px;line-height:1.7;color:var(--text-muted);margin:0 0 6px}
  .hint{font-size:12.5px;color:var(--text-light);margin-top:14px;line-height:1.7}
  .actions{display:flex;flex-direction:column;gap:10px;margin-top:22px}
  button{font:inherit;font-size:15px;border-radius:14px;padding:13px 16px;cursor:pointer;
         border:1px solid transparent;transition:transform .12s ease,opacity .12s ease}
  button:active{transform:scale(.985);opacity:.9}
  .primary{background:var(--primary);color:#fff;font-weight:600}
  .ghost{background:#fff;color:var(--text-muted);border-color:var(--border)}
</style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"></path>
        <path d="M8.5 16.4a5 5 0 0 1 7 0"></path>
        <path d="M5 13a10 10 0 0 1 14 0"></path>
        <path d="M2 9.5a15 15 0 0 1 20 0"></path>
      </svg>
    </div>
    <h1>这个页面没打开</h1>
    <p>网络像是断了，或者这一页暂时不可用。</p>
    <p>你记的体重、饮食和训练都在服务器上，没有丢——网络回来就能看到。</p>
    <div class="actions">
      <button class="primary" id="retry" type="button">再试一次</button>
      <button class="ghost" id="home" type="button">回到首页</button>
    </div>
    <p class="hint">如果一直打不开，检查一下 Wi-Fi 或流量，再点「再试一次」。</p>
  </main>
  <script>
  (function () {
    // 失败的是哪一页就回哪一页：不带这个参数时退回首页，避免刷新到一个空地址。
    var params = new URLSearchParams(location.search);
    var target = params.get("retry") || "";
    var retry = document.getElementById("retry");
    var home = document.getElementById("home");
    function go(url) {
      if (!url) return;
      location.replace(url);
    }
    retry.addEventListener("click", function () { go(target || location.href); });
    home.addEventListener("click", function () { go(target || location.href); });
    if (!target) { retry.disabled = true; retry.textContent = "没有可重试的页面"; }
  })();
  </script>
</body>
</html>
