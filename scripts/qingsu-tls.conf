server {
    listen 443 ssl;
    server_name 124.220.54.64;
    ssl_certificate /etc/letsencrypt/live/124.220.54.64/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/124.220.54.64/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40m;
    access_log off;
    add_header Strict-Transport-Security "max-age=2592000" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    # 私信的 WebSocket 必须单独一条：nginx 默认按 HTTP/1.0 转发且不带 Upgrade 头，
    # 少了 proxy_http_version + 那两颗头，握手永远 400，
    # 页面只会显示"实时连接用不了"（发消息退回 HTTP 照样能发，所以坏在暗处）。
    # 超时给到 1 小时：客户端每 30 秒 ping 一次，只有真死的连接才该被掐。
    location /ws/ {
        proxy_pass http://172.17.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://172.17.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
