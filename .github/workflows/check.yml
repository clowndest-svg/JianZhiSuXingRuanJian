name: CI and production deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: qingsu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Sync Android and H5 build number
        run: python make_version_json.py --sync-asset-build-only
      - name: Build and lint release APK
        run: bash gradlew assembleRelease lintRelease
      - name: Prepare unsigned artifact for CI contract checks
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk qingsu.apk
          python make_version_json.py
          mkdir -p .release-test/app/src/main/assets .release-test/app/src/main
          cp qingsu.apk .release-test/qingsu.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk .release-test/app-release-unsigned.apk
          cp app/src/main/assets/app.js .release-test/app/src/main/assets/app.js
          cp app/src/main/web_version.json .release-test/app/src/main/web_version.json
      - uses: actions/upload-artifact@v4
        with:
          name: qingsu-unsigned-release
          path: |
            .release-test/qingsu.apk
            .release-test/app-release-unsigned.apk
            .release-test/app/src/main/assets/app.js
            .release-test/app/src/main/web_version.json
          retention-days: 2

  integration:
    runs-on: ubuntu-latest
    needs: android
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.2.7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      # B07 那条判据借用了后台仓库的 disposable 夹具（真发请求、真读库）。
      # 缺这一仓时它会直接起不来——本地是兄弟目录，CI 里必须显式签出来。
      - uses: actions/checkout@v4
        with:
          repository: clowndest-svg/JianZhiSuXingRuanJianHouTai
          ref: 5c2e059b48bc641100f70425d2a2e5280fac1032
          path: .admin-repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: qingsu-unsigned-release
          path: .release-artifact
      - name: Use the build-number-aligned artifact for contract checks
        run: |
          cp .release-artifact/qingsu.apk qingsu.apk
          cp .release-artifact/app/src/main/assets/app.js app/src/main/assets/app.js
          cp .release-artifact/app/src/main/web_version.json app/src/main/web_version.json
          python scripts/verify-release-artifacts.py \
            --apk qingsu.apk \
            --manifest app/src/main/web_version.json \
            --web-app-js app/src/main/assets/app.js \
            --gradle app/build.gradle
      - run: python -m pip install -r requirements-dev.txt
      - name: Install voice decoder
        timeout-minutes: 4
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            # The runner's Azure mirror can trickle downloads for many minutes.
            # Only the disposable runner is changed; use Ubuntu's own HTTPS mirror.
            sudo python3 - <<'PY'
          from pathlib import Path
          for path in (Path('/etc/apt/sources.list'), Path('/etc/apt/sources.list.d/ubuntu.sources')):
              if path.is_file():
                  path.write_text(path.read_text().replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu').replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu'))
          PY
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - run: mkdir -p _audit_sandbox
      - run: python tests/test_integration.py
      - run: python tests/test_ai_contract.py
      # B06：配置在 / 真跑通过 / 最后一次成功时间必须分开答，且状态里不许带提示词
      - run: python tests/test_optimization_ai_status.py
      # B07：周报三维 + 2~3 条带依据的反馈；缺记日不许当 0 摄入
      - name: B07 weekly review contracts
        env:
          QINGSU_ADMIN_REPO: ${{ github.workspace }}/.admin-repo
          QINGSU_APP_REPO: ${{ github.workspace }}
        run: python tests/test_optimization_weekly.py
      - run: python tests/test_update_copy.py
      - run: python tests/test_companion.py
      - run: python tests/test_chat_media.py
      - run: python tests/test_r173_contracts.py
      # 发布入口那道版本配对门：后台先于主服务上线必须被拦住，而不是等运营点炸
      - run: python tests/test_deploy_pairing.py
      - run: python tests/test_calls.py
      - run: python tests/test_native_media_contract.py
      - run: python tests/test_douyin_bridge.py
      # 并发与冗余计数：起真 Uvicorn 打同一批请求，判据只看落库结果
      - run: python tests/test_consistency.py
      # 多进程共享限流：CI 起了 Redis 服务，所以这里"连不上 Redis"就是红而不是跳过
      - name: Verify cross-process rate limiting
        env:
          QINGSU_REQUIRE_REDIS: '1'
          QINGSU_REDIS_URL: redis://127.0.0.1:6379/0
        run: python tests/test_multiprocess.py
      - run: python tests/legacy-backend.py
      - run: python tests/test_long_tasks.py
      - run: python tests/test_monitor_alerts.py
      - run: python tests/test_backup_verify.py
      - run: python tests/test_backup_snapshot.py
      - run: node --check app/src/main/assets/app.js
      - run: node --check app/src/main/assets/features.js
      - run: node --check app/src/main/assets/sw.js
      - run: node --check app/src/main/assets/companion.js
      - run: node tests/legacy-frontend.mjs
      - run: node tests/frontend-integration.mjs
      - run: node tests/pwa-cache-contract.mjs
      - run: node tests/frontend-budget.mjs
      - run: node tests/request-contract.mjs
      - run: node tests/ai-status-ui.mjs
      - run: node tests/dm-asr-race.mjs
      # 私信四态 / 单条重试复用 request_id / 重连补拉 / 通话失败分型
      - run: node tests/dm-state-call.mjs
      - run: node tests/exercise-video.mjs
      # B01：首屏三组的顺序、点击、状态机与"未知不画成 0"
      - run: node tests/home-first-screen.mjs
      - name: Install browser test runtime
        # 版本必须钉住：这台机器上验过的就是 1.64.1，浮动安装会让"今天绿的判据"
        # 变成"明天因为浏览器换版而红"，排查时看不出是产品坏还是工具换版。
        run: |
          npm install --prefix "$RUNNER_TEMP/chat-ui" playwright@1.64.1
          "$RUNNER_TEMP/chat-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify chat with real Chromium and isolated API
        env:
          NODE_PATH: ${{ runner.temp }}/chat-ui/node_modules
          # 后台翻页那条会 spawn 一个起服务的夹具，夹具按这两个变量找仓库与解释器
          QINGSU_ADMIN_REPO: ${{ github.workspace }}/.admin-repo
          QINGSU_APP_REPO: ${{ github.workspace }}
          QINGSU_TEST_PYTHON: python
        run: |
          node tests/chat-ui.mjs
          node tests/media-cache-ui.mjs
          node tests/recovery-ui.mjs
          node tests/offline-day-ui.mjs
          node tests/a11y-dialog-contract.mjs
          # 后台四个工作台的真翻页（它自己 spawn admin-pagination-server.py 当夹具）
          node tests/admin-pagination-ui.mjs

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [android, integration]
    timeout-minutes: 60
    environment:
      name: production
      url: https://124.220.54.64/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify the active public HTTPS entry before changing production
        run: |
          python - <<'PY'
          import json, urllib.request
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open('https://124.220.54.64/health/ready',timeout=20) as r:
              base=json.load(r).get('site_base','https://124.220.54.64')
          if base not in ('https://124.220.54.64','https://scientificexploration.art'):
              raise SystemExit('Unexpected active public entry')
          with opener.open(base+'/health/ready',timeout=20) as r:
              assert json.load(r)['status']=='ok'
          print('Verified active public entry:',base)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: qingsu-unsigned-release
          path: .release-artifact
      - name: Determine whether Android application sources changed
        id: app-changes
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$PUSH_BEFORE" "$GITHUB_SHA" -- \
              app/build.gradle app/src/main gradle gradlew gradle.properties build.gradle settings.gradle; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
          # 上一次发版可能在签名/部署中途失败：线上还是旧号而仓库已经升了。
          # 那种情况下必须重新构建签名包，不能复用线上旧包（否则清单与 gradle 对不上）。
          LIVE_CODE=$(curl --fail --silent --show-error --location --proto '=https' \
            'https://124.220.54.64/version.json?ci-check=${GITHUB_RUN_ID}' | \
            python -c 'import json,sys;print(json.load(sys.stdin)["version_code"])')
          CURRENT_CODE=$(python -c "import re,pathlib;print(re.search(r'versionCode\s+(\d+)', pathlib.Path('app/build.gradle').read_text(encoding='utf-8')).group(1))")
          echo "live=$LIVE_CODE repo=$CURRENT_CODE"
          if [ "$CURRENT_CODE" -gt "$LIVE_CODE" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Read current public release manifest
        run: |
          curl --fail --silent --show-error --location --proto '=https' \
            'https://124.220.54.64/version.json' --output "$RUNNER_TEMP/live-version.json"
      - name: Require an Android versionCode increase for app source changes
        if: steps.app-changes.outputs.changed == 'true'
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')
          hit = re.search(r'versionCode\s+(\d+)', gradle)
          live = int(json.loads(Path(__import__('os').environ['RUNNER_TEMP'], 'live-version.json').read_text())['version_code'])
          current = int(hit.group(1)) if hit else 0
          if current <= live:
              raise SystemExit(f'app source changed but versionCode {current} is not newer than live build {live}')
          print(f'Android release gate: build {current} follows live build {live}')
          PY
      - name: Prepare signed APK for an Android release
        if: steps.app-changes.outputs.changed == 'true'
        env:
          ANDROID_SIGNING_BUNDLE_BASE64: ${{ secrets.ANDROID_SIGNING_BUNDLE_BASE64 }}
          ANDROID_LEGACY_KEYSTORE: ${{ runner.temp }}/qingsu-signing/keys/legacy-debug.keystore
        run: |
          cp .release-artifact/app/src/main/assets/app.js app/src/main/assets/app.js
          mkdir -m 700 "$RUNNER_TEMP/qingsu-signing"
          printf '%s' "$ANDROID_SIGNING_BUNDLE_BASE64" | base64 --decode | tar -xz -C "$RUNNER_TEMP/qingsu-signing"
          # 只给文件收紧权限；对目录 chmod 600 会去掉执行位，后面连 keys/ 都进不去
          chmod -R u+rwX "$RUNNER_TEMP/qingsu-signing"
          find "$RUNNER_TEMP/qingsu-signing" -type f -exec chmod 600 {} +
          cp .release-artifact/app-release-unsigned.apk "$RUNNER_TEMP/app-release-unsigned.apk"
          python scripts/sign-release.py \
            --input "$RUNNER_TEMP/app-release-unsigned.apk" \
            --output qingsu.apk \
            --key-dir "$RUNNER_TEMP/qingsu-signing"/keys
          python make_version_json.py
      - name: Reuse the current signed Android release for backend and web changes
        if: steps.app-changes.outputs.changed == 'false'
        run: |
          curl --fail --silent --show-error --location --proto '=https' \
            "https://124.220.54.64/version.json?ci=$GITHUB_RUN_ID" \
            --output app/src/main/web_version.json
          curl --fail --silent --show-error --location --proto '=https' \
            "https://124.220.54.64/qingsu.apk?ci=$GITHUB_RUN_ID" --output qingsu.apk
          curl --fail --silent --show-error --location --proto '=https' \
            "https://124.220.54.64/app.js?ci=$GITHUB_RUN_ID" \
            --output app/src/main/assets/app.js
      - name: Validate release APK and build metadata
        run: |
          python scripts/verify-release-artifacts.py \
            --apk qingsu.apk \
            --manifest app/src/main/web_version.json \
            --web-app-js app/src/main/assets/app.js \
            --gradle app/build.gradle
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose qingsu.apk
      - name: Package explicit release files
        run: python scripts/package-release.py --output "$RUNNER_TEMP/qingsu-release.tar"
      - name: Upload release and invoke the restricted production deployer
        env:
          QINGSU_CI_SSH_KEY: ${{ secrets.QINGSU_CI_SSH_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/qingsu-ssh"
          printf '%s' "$QINGSU_CI_SSH_KEY" > "$RUNNER_TEMP/qingsu-ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/qingsu-ssh/id_ed25519"
          install -m 600 .github/deploy_known_hosts "$RUNNER_TEMP/qingsu-ssh/known_hosts"
          sha256sum "$RUNNER_TEMP/qingsu-release.tar" > "$RUNNER_TEMP/qingsu-release.sha256"
          read -r ARCHIVE_SHA _ < "$RUNNER_TEMP/qingsu-release.sha256"
          scp -C -i "$RUNNER_TEMP/qingsu-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/qingsu-ssh/known_hosts" \
            "$RUNNER_TEMP/qingsu-release.tar" \
            "qingsu-ci@124.220.54.64:/opt/qingsu/ci-incoming/main-${GITHUB_RUN_ID}.tar"
          ssh -i "$RUNNER_TEMP/qingsu-ssh/id_ed25519" \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/qingsu-ssh/known_hosts" \
            qingsu-ci@124.220.54.64 \
            sudo -n /usr/local/sbin/qingsu-ci-deploy main "$GITHUB_RUN_ID" "$ARCHIVE_SHA" "$GITHUB_SHA"
